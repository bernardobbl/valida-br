name: CI/CD

# Secure Pipeline:
#   lint ──► testes (3.10–3.13) ──► build ──► DAST (OWASP ZAP) ──► release (só em tag v*)
#   SAST (Semgrep) ─────────────────┘
#
# As actions estão fixadas pelo SHA do commit (o comentário mostra a versão): tags como
# @v5 podem ser movidas pelo dono do repositório, o SHA não. O próprio SAST verifica isso.

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.3"
      - run: ruff check .
      - run: ruff format --check .

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publicar o SARIF na aba Security
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install "semgrep==1.185.0"
      - name: Varredura Semgrep
        # Regras do registro (Python, segredos, GitHub Actions) + regras próprias em .semgrep/
        run: >
          semgrep scan --metrics=off
          --config p/python --config p/secrets --config p/github-actions
          --config .semgrep/
          --json-output=semgrep.json --sarif-output=semgrep.sarif
      - name: Validação SAST (gate)
        # Reprova o pipeline se houver achado de severidade média (WARNING) ou maior
        run: python scripts/gate_seguranca.py semgrep semgrep.json --falha-em media
      - name: Publicar na aba Security do GitHub
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true # repositório privado sem GHAS não aceita SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Guardar relatório SAST
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: relatorio-sast
          path: |
            semgrep.json
            semgrep.sarif
          if-no-files-found: ignore

  test:
    name: Testes (Python ${{ matrix.python }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --junitxml=resultado.xml
      - name: Smoke test da CLI
        run: |
          validabr --version
          validabr checa 529.982.247-25 11.222.333/0001-81
          validabr gera cpf -q 3

  build:
    name: Build do pacote
    needs: [test, sast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pacote-valida-br
          path: dist/

  dast:
    name: DAST (OWASP ZAP)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: pacote-valida-br
          path: dist/
      - name: Instalar o pacote gerado no build
        run: pip install dist/*.whl
      - name: Subir a aplicação
        run: |
          nohup validabr serve --host 127.0.0.1 --porta 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "::error::A API não respondeu em /health"
          cat api.log
          exit 1
      - name: Varredura OWASP ZAP (baseline)
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R a+rwx zap
          set +e
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:8000 -c rules.tsv -I \
            -J zap-report.json -r zap-report.html -w zap-report.md
          codigo=$?
          # 0 = sem alertas, 1 = regra FAIL, 2 = só avisos, 3 = erro do ZAP
          echo "zap-baseline terminou com código $codigo"
          if [ "$codigo" -ge 3 ]; then
            echo "::error::O ZAP não conseguiu executar a varredura"
            exit 1
          fi
      - name: Validação DAST (gate)
        # Reprova se houver alerta de risco médio ou alto, ou alguma regra marcada FAIL
        run: >
          python scripts/gate_seguranca.py zap zap/zap-report.json
          --falha-em media --regras .zap/rules.tsv
      - name: Guardar relatório DAST
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: relatorio-dast
          path: zap/
          if-no-files-found: ignore

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, dast]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: pacote-valida-br
          path: dist/
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
